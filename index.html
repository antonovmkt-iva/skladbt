<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13223c">
<title>МастерСклад — каталог запчастей</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#142033;--muted:#6e7888;--line:#e3e8ef;--navy:#13223c;--shadow:0 10px 30px rgba(20,34,57,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}
.app{max-width:1120px;margin:0 auto;min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(227,232,239,.95)}
.topinner{padding:10px 14px 12px; padding-top:max(10px, env(safe-area-inset-top));}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brandmark{width:44px;height:44px;border-radius:14px;background:var(--navy);display:grid;place-items:center;color:#fff;font-size:21px;flex:none}
.brandcopy{min-width:0}.brandtitle{font-weight:900;font-size:16px;line-height:1.05}.brandsub{font-size:12px;line-height:1.12;color:#4d586a;margin-top:2px}
.tag{font-size:11px;color:#6f7a8c;border:1px solid var(--line);padding:8px 10px;border-radius:999px;background:#f8fafc;white-space:nowrap;flex:none}
.search{height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:15px;background:#f2f4f7;border:1px solid #e1e5eb}.search svg{width:20px;color:#667286;flex:none}.search input{width:100%;height:100%;border:0;outline:0;background:transparent;font-size:16px;color:var(--ink)}.search input::placeholder{color:#929baa}
main{padding:14px 13px 64px}
.promo{background:linear-gradient(135deg,#13223c 0%,#294975 100%);color:#fff;border-radius:22px;padding:16px 16px 14px;box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden}.promo:after{content:"";position:absolute;inset:auto -40px -40px auto;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06)}.promobadge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.14);margin-bottom:9px}.promotext{font-size:20px;line-height:1.18;font-weight:900;max-width:560px}.promosub{margin-top:6px;font-size:13px;line-height:1.4;color:rgba(255,255,255,.82)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 13px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:#fff;color:#4f5969;border-radius:999px;padding:9px 12px;white-space:nowrap;font-size:12px;cursor:pointer}.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.sectionhead{display:flex;justify-content:space-between;align-items:flex-end;margin:2px 2px 11px}.sectionhead h2{font-size:18px;margin:0}.count{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{border:1px solid var(--line);background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 8px rgba(24,35,52,.025);cursor:pointer;transition:.15s}.product:active{transform:scale(.985)}
.photo{aspect-ratio:1;background:#fbfbfc;border-bottom:1px solid #edf0f4;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain;transform:scale(var(--zoom,1));transform-origin:center center}
.pcopy{padding:10px 11px 11px}.node{font-size:10px;color:#778194;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pname{font-size:13px;line-height:1.24;font-weight:760;min-height:34px}.retailLabel,.wholesaleLabel{font-size:10px;color:#8790a0;margin-top:8px}.retailPrice{font-size:18px;line-height:1.05;font-weight:900;letter-spacing:-.02em}.wholesaleRow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}.wholesalePrice{font-size:14px;line-height:1.05;font-weight:850;color:#203556}.empty{display:none;text-align:center;padding:50px 12px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(11,17,27,.48);z-index:70;display:none;align-items:flex-end}.overlay.show{display:flex}.sheet{width:100%;background:#f5f7f9;max-height:95vh;overflow:auto;border-radius:26px 26px 0 0;box-shadow:0 -16px 50px rgba(0,0,0,.19);animation:up .18s ease;overscroll-behavior:contain;padding-bottom:20px}@keyframes up{from{transform:translateY(18px);opacity:.75}to{transform:none;opacity:1}}.handle{width:42px;height:5px;border-radius:999px;background:#c6cbd3;margin:9px auto 2px}
.detailbar{position:sticky;top:0;z-index:5;display:flex;justify-content:flex-end;padding:4px 13px 8px;background:#f5f7f9; padding-top:max(4px, env(safe-area-inset-top));}.close{border:0;background:#e6e9ee;width:40px;height:40px;border-radius:50%;font-size:24px;line-height:1;color:#465060;cursor:pointer}
.detailbody{padding:0 13px 28px}.detailtop{display:grid;grid-template-columns:116px 1fr;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:19px;padding:10px}.detailimgWrap{width:116px;height:116px;background:#fafafa;border-radius:13px;display:flex;align-items:center;justify-content:center;overflow:hidden}.detailimg{width:100%;height:100%;object-fit:contain;transform:scale(var(--zoom,1));transform-origin:center center}.detailnode{font-size:11px;color:var(--muted);margin-bottom:4px}.detailtitle{font-size:19px;line-height:1.12;margin:0;font-weight:880}
.tiersTitle{font-size:16px;font-weight:850;margin:17px 2px 9px}.tierlist{display:grid;gap:8px}.tier{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px}.tierhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.tiername{font-weight:850;font-size:14px}.tiergrade{font-size:12px;color:#4e5a6d;margin-top:3px}.tierpriceWrap{text-align:right}.tierlabel{font-size:10px;color:#8790a0;text-transform:uppercase;letter-spacing:.04em}.tierprice{font-size:21px;font-weight:920;letter-spacing:-.025em;white-space:nowrap}.wholesaleBox{margin-top:9px;border:1px dashed #d7dde6;border-radius:12px;padding:9px 10px;background:#fbfcfd}.wholesaleTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-end}.wholesaleCap{font-size:11px;color:#566275}.wholesaleBig{font-size:18px;font-weight:860;color:#203556}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;align-items:center}.article{font-size:11px;background:#f1f3f6;border-radius:8px;padding:6px 8px;color:#596475}.quality{font-size:11px;border-radius:999px;padding:6px 9px}.q0{background:#eff1f3;color:#5c6573}.q1{background:#eaf0ff;color:#2855bd}.q2{background:#e8f4ed;color:#176b45}.q3{background:#f2eafe;color:#69419b}
.footer{font-size:11px;line-height:1.5;color:#7c8695;padding:22px 5px 0;text-align:center}
@media(min-width:700px){.topinner{padding:13px 22px 12px; padding-top:max(13px, env(safe-area-inset-top));}.brandtitle{font-size:18px}.brandsub{font-size:13px}.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}main{padding:22px}.promotext{font-size:28px}.overlay{align-items:center;justify-content:center;padding:24px}.sheet{max-width:760px;border-radius:26px;max-height:90vh}.detailbody{padding:0 20px 30px}.detailtop{grid-template-columns:176px 1fr}.detailimgWrap{width:176px;height:176px}.detailtitle{font-size:25px}}
</style>
</head>

</div>

const NODE_ORDER=['Все','Слив','Нагрев','Залив воды','Люк','Привод','Подвеска','Бак и барабан','Патрубки и шланги','Датчики и электрика','Электроника'];
const LEVEL={
  'Эконом':{client:'Эконом',grade:'Grade B',discount:.15},
  'Фабричный Китай':{client:'Стандарт',grade:'Grade A',discount:.17},
  'Качественный аналог':{client:'Качественный аналог',grade:'Grade A+',discount:.18},
  'Премиум':{client:'Премиум',grade:'Grade A++',discount:.20}
};
const chips=document.getElementById('chips');
const cards=document.getElementById('cards');
const count=document.getElementById('count');
const empty=document.getElementById('empty');
const search=document.getElementById('search');
const overlay=document.getElementById('overlay');
let activeNode='Все';
NODE_ORDER.forEach(node=>{const b=document.createElement('button'); b.className='chip'+(node==='Все'?' active':''); b.textContent=node; b.dataset.node=node; b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); b.classList.add('active'); activeNode=node; render();}; chips.appendChild(b);});
const money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';
const wholesale=t=>Math.max(1, Math.round(t.price*(1-LEVEL[t.level].discount)));
const minPrice=it=>Math.min(...it.tiers.map(t=>t.price));
const minWholesale=it=>Math.min(...it.tiers.map(t=>wholesale(t)));
function render(){
  const q=search.value.trim().toLowerCase().replace(/ё/g,'е');
  const filtered=ITEMS.filter(it=>{
    const hay=(it.name+' '+it.node+' '+(it.aliases||'')).toLowerCase().replace(/ё/g,'е');
    return (activeNode==='Все'||it.node===activeNode) && (!q||hay.includes(q));
  });
  count.textContent=filtered.length+' из '+ITEMS.length;
  empty.style.display=filtered.length?'none':'block';
  cards.innerHTML=filtered.map(it=>`<article class="product" onclick="openItem('${encodeURIComponent(it.name)}')"><div class="photo"><img loading="lazy" src="${it.imageData}" alt="${it.name}" style="--zoom:${it.zoom||1}"></div><div class="pcopy"><div class="node">${it.node}</div><div class="pname">${it.name}</div><div class="retailLabel">розница</div><div class="retailPrice">${money(minPrice(it))}</div><div class="wholesaleRow"><div><div class="wholesaleLabel">опт от 50 шт.</div><div class="wholesalePrice">${money(minWholesale(it))}</div></div></div></div></article>`).join('');
}
search.addEventListener('input',render);
function openItem(encoded){
  const name=decodeURIComponent(encoded),it=ITEMS.find(x=>x.name===name); if(!it)return;
  const dImg=document.getElementById('detailImg'); dImg.src=it.imageData; dImg.alt=it.name; dImg.style.setProperty('--zoom', it.zoom||1);
  document.getElementById('detailNode').textContent=it.node;
  document.getElementById('detailTitle').textContent=it.name;
  document.getElementById('tierList').innerHTML=it.tiers.map((t,idx)=>{ const m=LEVEL[t.level]; const opt=wholesale(t); return `<section class="tier"><div class="tierhead"><div><div class="tiername">${m.client}</div><div class="tiergrade">Класс качества: ${m.grade}</div></div><div class="tierpriceWrap"><div class="tierlabel">розница</div><div class="tierprice">${money(t.price)}</div></div></div><div class="wholesaleBox"><div class="wholesaleTop"><div><div class="wholesaleCap">Оптовая цена</div><div class="wholesaleBig">${money(opt)}</div></div><div class="wholesaleCap">при заказе от 50 шт.</div></div></div><div class="meta"><span class="article">Артикул ${t.article}</span><span class="quality q${idx}">${m.grade}</span></div></section>`; }).join('');
  overlay.classList.add('show'); document.body.style.overflow='hidden';
}
function closeItem(){overlay.classList.remove('show'); document.body.style.overflow='';}
overlay.addEventListener('click',e=>{if(e.target===overlay) closeItem()}); document.getElementById('close').addEventListener('click',closeItem); document.addEventListener('keydown',e=>{if(e.key==='Escape') closeItem()});
render();
</script>
</body>
